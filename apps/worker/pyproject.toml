[project]
name = "workflows-app"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "utils",
    "env",
    "mistralai>=3.6.0",
    "mistralai-workflows[mistralai]>=3.20.0",
    "pydantic>=2.14.4",
    "structlog>=25.5.0",
    "ocrmypdf>=17.14.2",
    "pypdf>=7.1.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker"

[tool.uv.sources]
utils = { workspace = true }
env = { workspace = true }
mistralai-workflows = { index = "pypi" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

