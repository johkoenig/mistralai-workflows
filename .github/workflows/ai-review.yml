name: AI review (Mistral)

# Advisory only: posts one review comment per PR, never approves, never fails the build.
# Security notes for this now-public repository:
# - pull_request (NOT pull_request_target): fork PRs never receive secrets.
# - Only PRs from authors with write access (OWNER/MEMBER/COLLABORATOR) run at all;
#   the script re-checks author_association from the event payload. Drafts/forks/bots skip.
# - continue-on-error: an advisory reviewer must never redden a PR.
permissions: {}

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run AI review
        run: python3 .github/scripts/ai_review.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
