version: 2
updates:
  # Python workspace: root pyproject.toml + uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  # JS/TS workspace: root package.json + bun.lock (bun workspaces)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
  # CI actions in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Worker image base. Major bumps of the python base image are ignored on
  # purpose: requires-python in pyproject.toml caps the supported interpreter,
  # and the CI gate check_docker_base.py fails such PRs anyway. A Python major
  # upgrade must be a deliberate PR that bumps Dockerfile + requires-python +
  # .python-version together.
  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
